name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: TestNG groups to run (empty = all, or "smoke")
        default: ""
  schedule:
    - cron: "41 4 * * *" # nightly, to catch drift in browsers and dependencies

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Start the shop (installs on first start)
        run: docker compose up -d --wait

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The runner's Chrome is used directly; Selenium Manager resolves the matching driver.
      - name: Run tests
        run: mvn -B test -Dbase.url=http://localhost:8080 -Dgroups="${{ inputs.groups }}"

      - name: Shop logs
        if: failure()
        run: docker compose logs --tail=200 shop

      - name: Build Allure report
        if: always()
        run: npx --yes allure-commandline@2.46.1 generate target/allure-results --clean -o target/allure-report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/allure-report/
            target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the shop
        if: always()
        run: docker compose down -v
